[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

# The log showed no Next.js runtime step, so install it explicitly.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  # False positives: the path value ("./serviceAccountKey.json") is also the default in
  # src/server/env.js, and NEXT_PUBLIC_* values are public by design (inlined into client JS).
  # OPENROUTER_SITE_URL is a public URL sent to OpenRouter for attribution, not a secret. Its value
  # (a localhost URL) also appears in Next.js's own source maps, README.md, api.http and electron/.
  SECRETS_SCAN_OMIT_KEYS = "FIREBASE_SERVICE_ACCOUNT_PATH,NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID,OPENROUTER_API_KEY,OPENROUTER_SITE_URL,OPENROUTER_LLM_MODEL,OPENROUTER_MODEL,NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID"
